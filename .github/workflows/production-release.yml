name: Production release and safe branch cleanup
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Choose release or safe branch cleanup
        type: choice
        options: [release, prune-merged]
        default: release
        required: true
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: production-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Production
          persist-credentials: false
      - name: Remove only merged branches with no open PR
        if: inputs.operation == 'prune-merged'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            [[ "$branch" == "Production" ]] && continue
            open=$(gh pr list --head "$branch" --state open --json number --jq 'length')
            [[ "$open" == "0" ]] || { echo "KEEP $branch: open PR"; continue; }
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/Production...$branch" --jq '.ahead_by')
            [[ "$ahead" == "0" ]] || { echo "KEEP $branch: $ahead unique commits"; continue; }
            echo "Removing merged branch: $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          done
      - name: Locate validated Production MSI
        id: installer
        if: inputs.operation == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow windows-build.yml --branch Production --commit "$sha" --event push --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$run_id" ]] || { echo "Production MSI CI must pass first"; exit 1; }
          mapfile -t artifacts < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("SensorDash-Setup-") and endswith("-x64.msi")) | [.id, .name] | @tsv')
          [[ "${#artifacts[@]}" -eq 1 ]] || { echo "Expected one raw MSI artifact; found ${#artifacts[@]}"; exit 1; }
          IFS=$'\t' read -r artifact_id artifact_name <<< "${artifacts[0]}"
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || exit 1
          [[ "$artifact_name" =~ ^SensorDash-Setup-([0-9]+\.[0-9]+\.[0-9]+)-x64\.msi$ ]] || exit 1
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      # Direct-file artifacts (upload-artifact v7 archive:false) are NOT zip archives.
      # actions/download-artifact v8 supports them; gh run download does not.
      - name: Download raw MSI (no ZIP)
        if: inputs.operation == 'release'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.installer.outputs.artifact_id }}
          run-id: ${{ steps.installer.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Publish MSI directly on GitHub Releases
        if: inputs.operation == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MSI: ${{ steps.installer.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          mapfile -d '' msis < <(find release-assets -type f -name '*.msi' -print0)
          [[ "${#msis[@]}" -eq 1 ]] || { echo "Expected exactly one MSI; found ${#msis[@]}"; exit 1; }
          file=$(basename "${msis[0]}")
          [[ "$file" == "$EXPECTED_MSI" ]] || { echo "Unexpected MSI filename: $file"; exit 1; }
          [[ "$file" =~ ^SensorDash-Setup-([0-9]+\.[0-9]+\.[0-9]+)-x64\.msi$ ]] || exit 1
          [[ -s "${msis[0]}" ]] || { echo "MSI is empty"; exit 1; }
          version="v${BASH_REMATCH[1]}"
          if gh release view "$version" >/dev/null 2>&1; then echo "Release already exists"; exit 1; fi
          gh release create "$version" "${msis[0]}" --target "$sha" --title "SensorDash $version" --generate-notes
          gh release view "$version" --json assets --jq '.assets[].name' | grep -Fx "$file"
